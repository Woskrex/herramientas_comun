<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Herramientas en Común</title>
</head>
<body>
    <header>
        <h1>Herramientas en Común</h1>
    <nav>
        <a href="{% url 'inicio' %}">Inicio</a>

        {% if user.is_authenticated %}
            <span>Usuario: {{ user.username }}</span>

            <form method="post" action="{% url 'logout' %}">
                {% csrf_token %}
                <button type="submit">Cerrar sesión</button>
            </form>
        {% else %}
            <a href="{% url 'login' %}">Iniciar sesión</a>
        {% endif %}
    </nav>
    </header>

    <main>
        {% block contenido %}
        {% endblock %}
    </main>
</body>
</html>
